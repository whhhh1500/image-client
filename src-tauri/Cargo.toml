[package]
name = "image-client"
version = "0.2.6"
description = "Image-Client: cloud AI + local ffmpeg media editing client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "image_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Deliberately excluded from the desktop release.  This feature contains the
# one-off, isolated real-provider acceptance runner and still requires its
# explicit runtime switch before it can do anything.
real-e2e-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
base64 = "0.22"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md5 = "0.7"
sha2 = "0.10"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["process", "io-util", "net", "rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "rayon"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Release builds were using the default profile (no LTO, 16 codegen units, no
# stripping), which bloats the shipped binary and blocks cross-crate inlining.
# `panic = "abort"` is deliberately omitted so `cargo test --release` still works.
[profile.release]
lto = true
codegen-units = 1
strip = true
