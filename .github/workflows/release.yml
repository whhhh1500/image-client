name: Publish release

# Default release path is Windows-only: a tag build costs ~2 billed minutes on
# Linux plus ~2x that on Windows, while the macOS runner is billed at 10x and
# dominated the previous bill (85 of ~125 minutes per tag). macOS is therefore
# opt-in through a manual dispatch on the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      macos:
        description: "同时构建并附加 macOS Apple Silicon 版本"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.16.0

jobs:
  # Verification and native packaging intentionally start together. Bundles are
  # kept as workflow artifacts until verification succeeds, so a failed test
  # can never publish a partial GitHub Release.
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-release.mjs --check-only --tag "${{ github.ref_name }}"
      - run: pnpm test
      - run: go test ./internal/...

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build portable executable
        run: wails build -clean -skipbindings -platform windows/amd64
      - name: Prepare one portable release file
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/package-release.mjs --platform windows-x64 --version "$version" --output-dir "release-exe/${{ github.ref_name }}"
      - name: Upload native bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-exe/${{ github.ref_name }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build native bundle
        run: wails build -clean -skipbindings -platform darwin/arm64
      # Apple Silicon refuses to run unsigned code; an ad-hoc signature lets
      # the unsigned release open after the usual Gatekeeper prompt.
      - name: Ad-hoc sign the app bundle
        run: codesign --force --deep --sign - build/bin/Image-Client.app
      - name: Prepare one portable release file
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/package-release.mjs --platform macos-arm64 --version "$version" --output-dir "release-exe/${{ github.ref_name }}"
      - name: Upload native bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: release-exe/${{ github.ref_name }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [verify, build-windows, build-macos]
    # `always()` is required: a skipped dependency (macOS on a plain tag build)
    # otherwise drags this job into "skipped" as well and no release is ever
    # published. The explicit result checks keep the safety property.
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          # Flat layout: one artifact does not get its own subdirectory, so the
          # release step must not depend on per-artifact folders.
          merge-multiple: true
      - name: Verify release files and generate release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Platforms are derived from the release file names, which are the
          # same whether the artifacts arrive flat or in subdirectories.
          platforms=""
          while IFS= read -r file; do
            case "$(basename "$file")" in
              *_x64_portable.exe) platforms="${platforms}windows-x64," ;;
              *_aarch64.app.tar.gz) platforms="${platforms}macos-arm64," ;;
            esac
          done < <(find release-artifacts -type f | sort)
          platforms="${platforms%,}"
          echo "platforms=$platforms"
          test -n "$platforms"
          node scripts/package-release.mjs --verify-all --version "$version" --output-dir release-artifacts --platforms "$platforms"
          node scripts/package-release.mjs --release-notes --version "$version" --notes-file release-notes.md --platforms "$platforms"
      - name: Publish one complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-artifacts -type f | sort)
          for asset in "${assets[@]}"; do echo "asset: $asset"; done
          # Idempotent: re-running on the same tag (for example to add macOS)
          # uploads the missing file instead of failing on an existing release.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "Image-Client ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
