name: Cross-platform verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cross-platform.yml"
      - ".github/workflows/release.yml"
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            cache_key: windows-x64
          - platform: ubuntu-22.04
            cache_key: linux-x64
          - platform: macos-latest
            cache_key: macos-arm64
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            cache_key: macos-x64
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-target-${{ matrix.cache_key }}
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --no-bundle --ci ${{ matrix.build_args }}
