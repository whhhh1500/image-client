name: Cross-platform verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "wails.json"
      - "build/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cross-platform.yml"
      - ".github/workflows/release.yml"
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: go vet ./internal/...
      - run: go test ./internal/...

  # A full native build per release target, on demand. Builds take well
  # under a minute, so there is no cache to prewarm.
  native-build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: wails build -clean -skipbindings -platform ${{ matrix.platform }}
